<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Abril+Fatface&family=Shrikhand&family=DM+Serif+Display&family=Courier+Prime:wght@700&family=Shantell+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
body{margin:0;background:#F3EDE6;color:#221C1E;-webkit-font-smoothing:antialiased}
a{color:#7E5FA8;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:#D9628F}
</style>
</helmet>
<main style="position:relative;min-height:100vh;background:#F3EDE6;font-family:'Shantell Sans',cursive;overflow-x:hidden">
  <sc-if value="{{ showGrid }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#E5DCD2 1px,transparent 1px),linear-gradient(90deg,#E5DCD2 1px,transparent 1px);background-size:28px 28px"></div>
  </sc-if>

  <section data-screen-label="01 Hero" style="position:relative;max-width:1280px;margin:0 auto;padding:56px clamp(20px,5vw,64px) 96px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:clamp(32px,4vw,64px);align-items:center;box-sizing:border-box">

    <div style="display:flex;flex-direction:column;gap:32px;min-width:0">

      <sc-if value="{{ isCutout }}" hint-placeholder-val="{{ false }}">
        <h1 aria-label="Hi, I’m Shivanthi." style="margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:14px;font-weight:400;transform:rotate(-2.5deg);transform-origin:left center;filter:drop-shadow(0 4px 5px rgba(74,52,40,.2))">
          <span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:clamp(40px,4.8vw,66px)">
            <span style="display:inline-flex;align-items:center;justify-content:center;min-width:.78em;padding:.1em .16em .06em;background-color:#E9D8BC;background-image:url(assets/paper-grain.svg);font-family:'Abril Fatface',serif;font-size:1em;line-height:1;color:#221C1E;transform:rotate(-6deg);">H</span>
            <span style="display:inline-flex;align-items:center;justify-content:center;min-width:.78em;padding:.14em .26em .1em;background-color:#7E5FA8;background-image:url(assets/paper-grain.svg);font-family:'Shrikhand',cursive;font-size:1em;line-height:1;color:#FCF3E2;transform:rotate(4deg);clip-path:polygon(3% 8%,18% 0,34% 6%,52% 1%,70% 7%,88% 0,100% 10%,97% 40%,100% 70%,96% 100%,78% 94%,60% 100%,42% 95%,22% 100%,4% 94%,0 60%,2% 30%);">i</span>
            <span style="display:inline-flex;align-items:center;justify-content:center;min-width:.5em;padding:.1em .16em .06em;background-color:#FCF3E2;background-image:url(assets/paper-grain.svg);font-family:'DM Serif Display',serif;font-size:.6em;line-height:1;color:#221C1E;transform:rotate(2deg) translateY(.35em);">,</span>
            <span style="display:inline-flex;align-items:center;justify-content:center;min-width:.78em;padding:.1em .24em .06em;background-color:#FCF3E2;background-image:url(assets/paper-grain.svg);font-family:'DM Serif Display',serif;font-size:1em;line-height:1;color:#221C1E;transform:rotate(-3deg);">I</span>
            <span style="display:inline-flex;align-items:center;justify-content:center;min-width:.5em;padding:.1em .16em .06em;background-color:#E9D8BC;background-image:url(assets/paper-grain.svg);font-family:'Abril Fatface',serif;font-size:.6em;line-height:1;color:#221C1E;transform:rotate(6deg) translateY(-.4em);">’</span>
            <span style="display:inline-flex;align-items:center;justify-content:center;min-width:.78em;padding:.1em .16em .06em;background-color:#E6DCF3;background-image:url(assets/paper-grain.svg);font-family:'Caveat Brush',cursive;font-size:1em;line-height:1;color:#221C1E;transform:rotate(5deg);">m</span>
          </span>
          <span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:clamp(50px,6.4vw,92px);margin-left:.3em">
            <span style="display:inline-flex;align-items:center;justify-content:center;min-width:.78em;padding:.1em .16em .06em;background-color:#7A5A44;background-image:url(assets/paper-grain.svg);font-family:'Abril Fatface',serif;font-size:1em;line-height:1;color:#FCF3E2;transform:rotate(-5deg);">S</span>
            <span style="display:inline-flex;align-items:center;justify-content:center;min-width:.78em;padding:.1em .16em .06em;background-color:#F5BBD0;background-image:url(assets/paper-grain.svg);font-family:'Instrument Serif',serif;font-size:1em;font-style:italic;line-height:1;color:#221C1E;transform:rotate(3deg);">h</span>
            <span style="display:inline-flex;align-items:center;justify-content:center;min-width:.78em;padding:.1em .16em .06em;background-color:#FCF3E2;background-image:url(assets/paper-grain.svg);font-family:'Courier Prime',monospace;font-size:1em;font-weight:700;line-height:1;color:#221C1E;transform:rotate(-2deg);">i</span>
            <span style="display:inline-flex;align-items:center;justify-content:center;min-width:.78em;padding:.14em .24em .1em;background-color:#C8B5E6;background-image:url(assets/paper-grain.svg);font-family:'Shrikhand',cursive;font-size:1em;line-height:1;color:#221C1E;transform:rotate(6deg);clip-path:polygon(3% 8%,18% 0,34% 6%,52% 1%,70% 7%,88% 0,100% 10%,97% 40%,100% 70%,96% 100%,78% 94%,60% 100%,42% 95%,22% 100%,4% 94%,0 60%,2% 30%);">v</span>
            <span style="display:inline-flex;align-items:center;justify-content:center;min-width:.78em;padding:.1em .16em .06em;background-color:#E9D8BC;background-image:url(assets/paper-grain.svg);font-family:'DM Serif Display',serif;font-size:1em;line-height:1;color:#FCF3E2;transform:rotate(-4deg);text-shadow:-2px 0 #221C1E,2px 0 #221C1E,0 -2px #221C1E,0 2px #221C1E,4px 4px 0 #D9628F;">a</span>
            <span style="display:inline-flex;align-items:center;justify-content:center;min-width:.78em;padding:.14em .24em .1em;background-color:#7E5FA8;background-image:url(assets/paper-grain.svg);font-family:'Abril Fatface',serif;font-size:1em;line-height:1;color:#FCF3E2;transform:rotate(3deg);clip-path:polygon(3% 8%,18% 0,34% 6%,52% 1%,70% 7%,88% 0,100% 10%,97% 40%,100% 70%,96% 100%,78% 94%,60% 100%,42% 95%,22% 100%,4% 94%,0 60%,2% 30%);">n</span>
            <span style="display:inline-flex;align-items:center;justify-content:center;min-width:.78em;padding:.1em .16em .06em;background-color:#F2A7C3;background-image:url(assets/paper-grain.svg);font-family:'Caveat Brush',cursive;font-size:1em;line-height:1;color:#221C1E;transform:rotate(-6deg);">t</span>
            <span style="display:inline-flex;align-items:center;justify-content:center;min-width:.78em;padding:.1em .16em .06em;background-color:#FCF3E2;background-image:url(assets/paper-grain.svg);font-family:'Courier Prime',monospace;font-size:1em;font-weight:700;line-height:1;color:#221C1E;transform:rotate(4deg);">h</span>
            <span style="display:inline-flex;align-items:center;justify-content:center;min-width:.78em;padding:.1em .16em .06em;background-color:#7A5A44;background-image:url(assets/paper-grain.svg);font-family:'Instrument Serif',serif;font-size:1em;line-height:1;color:#FCF3E2;transform:rotate(-3deg);">i</span>
            <span style="display:inline-flex;align-items:center;justify-content:center;min-width:.6em;padding:.1em .16em .06em;background-color:#F2A7C3;background-image:url(assets/paper-grain.svg);font-family:'Shrikhand',cursive;font-size:.55em;line-height:1;color:#221C1E;transform:rotate(0deg) translateY(.5em);">.</span>
          </span>
        </h1>
      </sc-if>
      <sc-if value="{{ isStrips }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;align-items:flex-start;transform:rotate(-3deg);transform-origin:left center">
        <div style="display:inline-block;margin-left:-22px;padding:10px 44px 6px 28px;background-color:#E9D8BC;background-image:url(assets/paper-grain.svg);transform:rotate(-2.5deg);clip-path:polygon(1% 9%,6% 2%,14% 7%,23% 1%,31% 6%,42% 0%,52% 5%,63% 1%,72% 7%,83% 2%,92% 6%,99% 1%,98% 30%,100% 58%,97% 82%,99% 97%,90% 93%,79% 99%,68% 94%,57% 100%,45% 95%,34% 99%,22% 93%,11% 98%,2% 94%,0% 70%,2% 42%)">
          <span style="font-family:'Caveat Brush',cursive;font-size:clamp(44px,5vw,72px);line-height:1;color:#221C1E">Hi, I’m</span>
        </div>
        <div style="position:relative;margin-top:-4px;margin-left:-10px;display:flex;align-items:center;gap:6px">
          <div style="padding:8px 40px 10px 30px;background-color:#F5BBD0;background-image:url(assets/paper-grain.svg);transform:rotate(-2deg);clip-path:polygon(0% 6%,8% 1%,17% 5%,27% 0%,38% 4%,49% 1%,58% 6%,69% 2%,80% 5%,90% 0%,100% 4%,98% 26%,100% 51%,97% 76%,100% 96%,91% 100%,81% 95%,70% 99%,60% 94%,48% 100%,37% 95%,26% 99%,15% 94%,6% 99%,0% 93%,2% 68%,0% 40%,2% 20%)">
            <span style="font-family:'Caveat Brush',cursive;font-size:clamp(56px,7vw,104px);line-height:1;color:#221C1E">Shivanthi.</span>
          </div>
        </div>
      </div>
      </sc-if>

      <p style="margin:0;max-width:30ch;font-size:clamp(20px,1.9vw,25px);line-height:1.55;color:#2E2628;text-wrap:pretty">I turn complex problems into clear, thoughtful experiences.</p>



      <div style="display:flex;align-items:center;gap:16px;flex-wrap:nowrap;margin-top:40px">
        <sc-if value="{{ isClick }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ goNext }}" aria-label="Open my work" style="position:relative;flex:none;width:250px;padding:0;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;transform:rotate(-6deg);transition:transform .25s cubic-bezier(.3,1.4,.5,1);filter:drop-shadow(5px 0 0 #FCF3E2) drop-shadow(-5px 0 0 #FCF3E2) drop-shadow(0 5px 0 #FCF3E2) drop-shadow(0 -5px 0 #FCF3E2) drop-shadow(0 0 1px #CDB596) drop-shadow(0 1px 1.5px rgba(74,52,40,.38)) drop-shadow(0 10px 16px rgba(74,52,40,.3))" style-hover="transform:rotate(-3deg) translateY(-6px) scale(1.03)" style-active="transform:rotate(-5deg) scale(.98)">
            <div style="position:relative;width:212px;height:146px;box-sizing:border-box;padding:12px;background-color:#E2B1A7;background-image:url(assets/paper-grain.svg);border:3px solid #221C1E;border-radius:18px 18px 8px 8px">
              <span style="position:absolute;top:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#221C1E"></span>
              <div style="position:relative;width:100%;height:100%;box-sizing:border-box;border:2.5px solid #221C1E;border-radius:7px;background:#FCF3E2;overflow:hidden;display:flex;flex-direction:column">
                <div style="display:flex;align-items:center;gap:3px;height:13px;padding:0 5px;border-bottom:2px solid #221C1E;background:#E6DCF3;flex:none">
                  <span style="width:4px;height:4px;border-radius:50%;background:#221C1E"></span>
                  <span style="width:4px;height:4px;border-radius:50%;background:#221C1E"></span>
                  <span style="width:4px;height:4px;border-radius:50%;background:#221C1E"></span>
                  <span style="flex:1;height:5px;margin-left:6px;border-radius:3px;border:1.5px solid #221C1E;background:#FCF3E2"></span>
                </div>
                <div style="flex:1;display:flex;flex-direction:column;gap:6px;padding:7px 9px">
                  <div style="display:flex;align-items:center;justify-content:space-between">
                    <span style="width:10px;height:10px;border-radius:50%;background:#F2A7C3;border:1.5px solid #221C1E"></span>
                    <span style="display:flex;gap:4px"><span style="display:block;width:14px;height:3px;border-radius:2px;background:#221C1E"></span><span style="display:block;width:14px;height:3px;border-radius:2px;background:#221C1E"></span><span style="display:block;width:14px;height:3px;border-radius:2px;background:#221C1E"></span></span>
                  </div>
                  <div style="display:flex;gap:8px;align-items:center">
                    <div style="flex:1;display:flex;flex-direction:column;gap:4px"><span style="display:block;width:90%;height:6px;border-radius:2px;background:#221C1E"></span><span style="display:block;width:60%;height:6px;border-radius:2px;background:#221C1E"></span><span style="display:block;width:80%;height:2px;border-radius:2px;background:#7A5A44"></span><span style="display:block;width:30px;height:8px;margin-top:2px;border-radius:4px;background:#7E5FA8"></span></div>
                    <span style="width:42px;height:34px;border:1.5px solid #221C1E;border-radius:3px;background:#E6DCF3;background-image:linear-gradient(to top right,transparent calc(50% - 1px),#221C1E calc(50% - 1px),#221C1E calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(to top left,transparent calc(50% - 1px),#221C1E calc(50% - 1px),#221C1E calc(50% + .5px),transparent calc(50% + .5px))"></span>
                  </div>
                  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:1">
                    <span style="border:1.5px solid #221C1E;border-radius:3px;background:#F5BBD0"></span>
                    <span style="border:1.5px solid #221C1E;border-radius:3px;background:#E9D8BC"></span>
                    <span style="border:1.5px solid #221C1E;border-radius:3px;background:#E6DCF3"></span>
                  </div>
                </div>
              </div>
            </div>
            <div style="position:relative;width:250px;height:20px;margin-top:-3px;box-sizing:border-box;background:#C38D86;border:3px solid #221C1E;border-radius:4px 4px 14px 14px">
              <span style="position:absolute;top:-3px;left:50%;width:44px;height:7px;margin-left:-22px;background:#221C1E;border-radius:0 0 8px 8px"></span>
            </div>
          </button>
        </sc-if>
        <sc-if value="{{ isPeel }}" hint-placeholder-val="{{ false }}">
          <div style="position:relative;width:190px;height:190px;flex:none;transform:rotate(-5deg)">
            <button onClick="{{ goNext }}" style="position:absolute;inset:0;border-radius:22px;border:2px dashed #C8B5E6;background-color:#F3EDF9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#221C1E;padding:0">
              <span style="font-family:'Caveat Brush',cursive;font-size:40px;line-height:1">My work</span>
              <span style="font-family:'Shantell Sans',cursive;font-size:14px;color:#7A5A44">scroll down ↓</span>
            </button>
            <div onPointerDown="{{ peelDown }}" onPointerMove="{{ peelMove }}" onPointerUp="{{ peelUp }}" onPointerCancel="{{ peelUp }}" style="position:absolute;inset:0;touch-action:none;cursor:grab;filter:drop-shadow(0 8px 10px rgba(74,52,40,.24));transition:{{ peelTransition }};transform:{{ peelTransform }};opacity:{{ peelOpacity }};pointer-events:{{ peelPointer }}">
              <div style="position:absolute;inset:0;box-sizing:border-box;border:9px solid #FCF3E2;border-radius:24px;background-color:#F2A7C3;background-image:url(assets/paper-grain.svg);clip-path:{{ frontClip }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
                <div style="position:absolute;inset:10px;border:2.5px dashed rgba(255,253,249,.85);border-radius:14px"></div>
                <span style="font-family:'Caveat Brush',cursive;font-size:48px;line-height:1;color:#221C1E">Peel me!</span>
                <span style="font-size:15px;color:#4A3428">to see my work</span>
              </div>
              <div style="position:absolute;left:-190px;top:-190px;width:380px;height:380px;background:#F1E8DF;clip-path:{{ flapClip }};pointer-events:none"></div>
            </div>
          </div>
        </sc-if>

        <div style="position:relative;flex:none;margin-left:92px;margin-top:-30px;transform:rotate(-3deg);color:#7A5A44">
          <svg width="84" height="40" viewBox="0 0 84 40" style="position:absolute;left:-88px;top:0" fill="none" stroke="#4A3F42" stroke-linecap="round" stroke-linejoin="round"><defs><filter id="pencil" x="-10%" y="-30%" width="120%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="3"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="1.8"></feDisplacementMap></filter></defs><g filter="url(#pencil)"><path d="M82 16C56 13 30 21 12 34" stroke-width="1.7" opacity=".9"></path><path d="M80 18C55 15 31 23 11 35.5" stroke-width="1.1" opacity=".6"></path><path d="M18 22L12 34 25 35" stroke-width="1.8" opacity=".9"></path><path d="M19 24L13.5 35 25.5 36.5" stroke-width="1.1" opacity=".55"></path></g></svg>
          <span style="display:block;font-family:'Caveat Brush',cursive;font-size:28px;line-height:1.05;max-width:10ch">{{ hintText }}</span>
        </div>
      </div>
    </div>

    <div style="position:relative;display:flex;justify-content:center;min-width:0;align-self:start;padding-right:40px;padding-bottom:190px;box-sizing:border-box">
      <div style="position:relative;width:100%;max-width:350px;transform:rotate(1.5deg)">
        <button onClick="{{ goAbout }}" aria-label="Know more about me" style="display:block;width:100%;padding:0;border:none;background:none;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.4,.5,1)" style-hover="transform:translateY(-6px) rotate(-1deg)" style-active="transform:scale(.98)">
        <img src="assets/shivanthi-sticker.png" alt="Illustrated portrait of Shivanthi waving" style="display:block;width:100%;height:auto;filter:saturate(.9) sepia(.05) contrast(.98) drop-shadow(0 1px 1.5px rgba(74,52,40,.38)) drop-shadow(0 10px 16px rgba(74,52,40,.3))">
        </button>
        <div style="position:absolute;right:-70px;top:calc(100% + 34px);transform:rotate(-2deg);color:#7A5A44;pointer-events:none">
          
          <div style="position:relative;width:max-content;margin:0 auto">
            <svg width="60" height="90" viewBox="0 0 60 90" style="position:absolute;right:-24px;bottom:calc(100% - 14px)" fill="none" stroke="#4A3F42" stroke-linecap="round" stroke-linejoin="round"><g filter="url(#pencil)"><path d="M30 86C50 64 48 30 14 8" stroke-width="1.7" opacity=".9"></path><path d="M32 84C51 61 46 30 13 9.5" stroke-width="1.1" opacity=".6"></path><path d="M12 24L14 8 29 12" stroke-width="1.8" opacity=".9"></path><path d="M13.5 25L15.5 9.5 28.5 14" stroke-width="1.1" opacity=".55"></path></g></svg>
            <span style="display:block;max-width:14ch;text-align:center;font-family:'Caveat Brush',cursive;font-size:28px;line-height:1.05">Click to know more about me</span>
          </div>
          <span style="display:block;margin-top:10px;text-align:center;font-family:'Caveat Brush',cursive;font-size:22px;color:#7A5A44">or</span>
          <button onClick="{{ copyEmail }}" title="Copy email" style="pointer-events:auto;position:relative;margin:8px auto 0;display:flex;align-items:center;gap:10px;padding:10px 18px 9px 36px;border:none;border-radius:4px 10px 10px 4px;background-color:#E9D8BC;background-image:url(assets/paper-grain.svg);outline:2px dashed rgba(122,90,68,.55);outline-offset:-6px;box-shadow:0 1px 1.5px rgba(74,52,40,.32),0 6px 10px rgba(74,52,40,.18);font-family:'Shantell Sans',cursive;font-size:16px;color:#4A3428;cursor:copy;transform:rotate(-2.5deg);transition:transform .2s cubic-bezier(.3,1.4,.5,1),box-shadow .2s ease" style-hover="transform:rotate(-1deg) translateY(-2px);box-shadow:0 2px 2px rgba(74,52,40,.3),0 12px 16px rgba(74,52,40,.22)" style-active="transform:rotate(0deg) translateY(1px);box-shadow:0 1px 1px rgba(74,52,40,.35)"><span style="position:absolute;left:13px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:#F3EDE6;box-shadow:inset 0 1px 2px rgba(74,52,40,.45)"></span><span style="font-family:'Caveat Brush',cursive;font-size:22px;line-height:1;color:#221C1E">email me</span>wscsfernando@gmail.com<sc-if value="{{ copied }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;font-weight:600;color:#7A5A44">copied!</span></sc-if><sc-if value="{{ notCopied }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7A5A44" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="3"></rect><path d="M5 15V6a3 3 0 0 1 3-3h7"></path></svg></sc-if></button>
        </div>
      </div>
    </div>
  </section>

  <sc-if value="{{ aboutRevealed }}" hint-placeholder-val="{{ false }}">
    <section ref="{{ aboutRef }}" data-screen-label="About" style="position:relative;max-width:1280px;margin:0 auto;padding:96px clamp(20px,5vw,64px) 120px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px">
      <h2 style="margin:0;font-family:'Caveat Brush',cursive;font-weight:400;font-size:clamp(56px,7vw,96px);line-height:1;color:#221C1E">About <span style="color:#7E5FA8">me</span></h2>
      <div style="margin-top:24px;padding:48px;border:2px dashed #CDB596;border-radius:6px;font-family:'Shantell Sans',cursive;font-size:15px;color:#7A5A44;text-align:center">About section — next brief</div>
    </section>
  </sc-if>
  <sc-if value="{{ revealed }}" hint-placeholder-val="{{ false }}">
    <section ref="{{ nextRef }}" data-screen-label="02 Work" style="position:relative;max-width:1280px;margin:0 auto;padding:96px clamp(20px,5vw,64px) 160px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px">
      <h2 style="margin:0;font-family:'Caveat Brush',cursive;font-weight:400;font-size:clamp(56px,7vw,96px);line-height:1;color:#221C1E">Selected <span style="color:#7E5FA8">work</span></h2>
      <div style="margin-top:24px;padding:48px;border:2px dashed #CDB596;border-radius:6px;font-family:'Shantell Sans',cursive;font-size:15px;color:#7A5A44;text-align:center">Section 02 — next brief</div>
    </section>
  </sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;headline&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;strips&quot;,&quot;cutout&quot;],&quot;default&quot;:&quot;strips&quot;,&quot;tsType&quot;:&quot;'strips' | 'cutout'&quot;},&quot;revealMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;click&quot;,&quot;peel&quot;],&quot;default&quot;:&quot;click&quot;,&quot;tsType&quot;:&quot;'click' | 'peel'&quot;},&quot;showGrid&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { revealed: false, cleared: false, d: 30, dragging: false, peeled: false };
  canvasRef = React.createRef();
  nextRef = React.createRef();
  aboutRef = React.createRef();
  S = 190;

  componentDidMount() { this.paintScratch(); }
  componentDidUpdate(prev) {
    if ((prev.revealMode ?? 'scratch') !== (this.props.revealMode ?? 'scratch')) {
      this.setState({ cleared: false, d: 30, peeled: false }, () => this.paintScratch());
    }
  }

  async paintScratch() {
    const cv = this.canvasRef.current; if (!cv) return;
    try { await document.fonts.load('48px "Caveat Brush"'); await document.fonts.load('500 20px "Shantell Sans"'); } catch (e) {}
    const c = cv.getContext('2d'), W = cv.width, H = cv.height;
    c.globalCompositeOperation = 'source-over';
    c.clearRect(0, 0, W, H);
    c.fillStyle = '#E6DCF3'; c.fillRect(0, 0, W, H);
    c.save(); c.strokeStyle = 'rgba(245,187,208,.6)'; c.lineWidth = 12;
    for (let i = -H; i < W + H; i += 34) { c.beginPath(); c.moveTo(i, 0); c.lineTo(i - H, H); c.stroke(); }
    c.restore();
    c.fillStyle = '#221C1E'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = '72px "Caveat Brush"'; c.fillText('Scratch me', W / 2, H / 2 - 18);
    c.font = '500 26px "Shantell Sans"'; c.fillStyle = '#4A3428'; c.fillText('to see my work', W / 2, H / 2 + 46);
  }

  pos(e) {
    const cv = this.canvasRef.current;
    const ox = e.nativeEvent.offsetX, oy = e.nativeEvent.offsetY;
    this.setState({ ex: ox, ey: oy });
    return [ox * cv.width / cv.offsetWidth, oy * cv.height / cv.offsetHeight];
  }
  eraserEnter = (e) => { this.pos(e); this.setState({ eraserOn: true }); };
  eraserLeave = () => { if (!this.drawing) this.setState({ eraserOn: false }); };
  scratchDown = (e) => { e.currentTarget.setPointerCapture(e.pointerId); this.drawing = true; this.last = this.pos(e); this.scratchAt(this.last, this.last); this.setState({ scrubbing: true, eraserOn: true }); };
  scratchMove = (e) => {
    const p = this.pos(e);
    if (!this.drawing) return;
    this.scratchAt(this.last, p);
    this.wig = (this.wig || 0) + Math.hypot(p[0] - this.last[0], p[1] - this.last[1]);
    this.last = p; if (++this.moves % 8 === 0) this.checkCleared();
  };
  scratchUp = () => { this.drawing = false; this.setState({ scrubbing: false }); this.checkCleared(); };
  moves = 0;
  scratchAt(a, b) {
    const c = this.canvasRef.current.getContext('2d');
    c.globalCompositeOperation = 'destination-out'; c.lineCap = 'round'; c.lineWidth = 110;
    c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
  }
  checkCleared() {
    if (this.state.cleared) return;
    const cv = this.canvasRef.current, W = cv.width, H = cv.height, d = cv.getContext('2d').getImageData(0, 0, W, H).data;
    let tot = 0, clr = 0;
    for (let y = 0; y < H; y += 6) for (let x = 0; x < W; x += 6) { tot++; if (d[(y * W + x) * 4 + 3] < 40) clr++; }
    if (clr / tot > 0.28) { this.setState({ cleared: true }); setTimeout(() => this.goNext(), 700); }
  }

  peelDown = (e) => { e.currentTarget.setPointerCapture(e.pointerId); this.start = [e.clientX, e.clientY]; this.setState({ dragging: true }); };
  peelMove = (e) => {
    if (!this.state.dragging) return;
    const delta = (this.start[0] - e.clientX) + (this.start[1] - e.clientY);
    this.setState({ d: Math.min(2 * this.S - 2, Math.max(30, 30 + delta * 0.75)) });
  };
  peelUp = () => {
    if (!this.state.dragging) return;
    if (this.state.d > this.S * 1.05) { this.setState({ dragging: false, peeled: true }); setTimeout(() => this.goNext(), 650); }
    else this.setState({ dragging: false, d: 30 });
  };

  clips() {
    const S = this.S, d = this.state.d, c = 2 * S - d;
    const front = d <= S ? [[0, 0], [S, 0], [S, S - d], [S - d, S], [0, S]] : [[0, 0], [c, 0], [0, c]];
    const cut = d <= S ? [[S, S - d], [S, S], [S - d, S]] : [[c, 0], [S, 0], [S, S], [0, S], [0, c]];
    const flap = cut.map(([x, y]) => [c - y + S, c - x + S]);
    const fmt = pts => 'polygon(' + pts.map(([x, y]) => `${x}px ${y}px`).join(',') + ')';
    return { frontClip: fmt(front), flapClip: fmt(flap) };
  }

  copyEmail = () => {
    const t = 'wscsfernando@gmail.com';
    const done = () => { this.setState({ copied: true }); clearTimeout(this.ct); this.ct = setTimeout(() => this.setState({ copied: false }), 1600); };
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); done(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
  };
  goAbout = () => {
    const go = () => { const el = this.aboutRef.current; if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 24, behavior: 'smooth' }); };
    if (this.state.aboutRevealed) go(); else this.setState({ aboutRevealed: true }, () => setTimeout(go, 60));
  };
  goNext = () => {
    const go = () => { const el = this.nextRef.current; if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 24, behavior: 'smooth' }); };
    if (this.state.revealed) go(); else this.setState({ revealed: true }, () => setTimeout(go, 60));
  };

  renderVals() {
    const mode = this.props.revealMode ?? 'click';
    const { cleared, peeled, dragging } = this.state;
    return {
      isClick: mode !== 'peel', isPeel: mode === 'peel',
      showGrid: this.props.showGrid ?? true,
      isCutout: (this.props.headline ?? 'strips') === 'cutout',
      isStrips: (this.props.headline ?? 'strips') === 'strips',
      hintText: mode === 'peel' ? 'Peel it to see my work' : 'Click on my laptop to see my work',
      canvasRef: this.canvasRef, nextRef: this.nextRef,
      scratchDown: this.scratchDown, scratchMove: this.scratchMove, scratchUp: this.scratchUp,
      eraserEnter: this.eraserEnter, eraserLeave: this.eraserLeave,
      eraserX: (this.state.ex ?? 86) + 'px', eraserY: (this.state.ey ?? 86) + 'px',
      eraserOpacity: this.state.eraserOn && !cleared ? 1 : 0,
      eraserRot: (this.state.scrubbing ? -38 + Math.sin((this.wig || 0) / 18) * 8 : -30) + 'deg',
      scratchOpacity: cleared ? 0 : 1, scratchPointer: cleared ? 'none' : 'auto',
      peelDown: this.peelDown, peelMove: this.peelMove, peelUp: this.peelUp,
      ...this.clips(),
      peelTransition: dragging ? 'none' : 'transform .6s cubic-bezier(.5,-0.3,.6,1), opacity .6s ease',
      peelTransform: peeled ? 'translate(-160px,-220px) rotate(-38deg)' : 'none',
      peelOpacity: peeled ? 0 : 1, peelPointer: peeled ? 'none' : 'auto',
      revealed: this.state.revealed, goNext: this.goNext,
      copyEmail: this.copyEmail, copied: !!this.state.copied, notCopied: !this.state.copied,
      aboutRevealed: !!this.state.aboutRevealed, goAbout: this.goAbout, aboutRef: this.aboutRef,
    };
  }
}
</script>
