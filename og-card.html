<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Source for assets/og-image.png (link preview, 1200×630). Re-render with headless Chrome after edits. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Shantell+Sans:wght@400;500&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#FCFAF7;background-image:linear-gradient(#EFE9E2 1px,transparent 1px),linear-gradient(90deg,#EFE9E2 1px,transparent 1px);background-size:28px 28px;color:#221C1E;-webkit-font-smoothing:antialiased}
.text{position:absolute;left:84px;top:0;bottom:0;width:600px;display:flex;flex-direction:column;justify-content:center}
h1{margin:0;font-family:'Caveat Brush',cursive;font-weight:400;font-size:96px;line-height:1.02}
h1 span{padding:0 .08em;background-image:linear-gradient(transparent 58%,#F5BBD0 58%,#F5BBD0 88%,transparent 88%)}
p{margin:30px 0 0;max-width:30ch;font-family:'Shantell Sans',cursive;font-size:30px;line-height:1.5}
.sticker{position:absolute;right:70px;bottom:22px;height:570px;filter:drop-shadow(0 2px 2px rgba(74,52,40,.3)) drop-shadow(0 12px 18px rgba(74,52,40,.22));transform:rotate(2deg)}
.scrap{position:absolute;border-radius:3px}
</style>
</head>
<body>
<div class="scrap" style="right:150px;top:70px;width:300px;height:380px;background:#E6DCF3;transform:rotate(-6deg)"></div>
<div class="scrap" style="right:60px;top:300px;width:220px;height:240px;background:#E9D8BC;transform:rotate(5deg)"></div>
<div class="text">
  <h1>Hi, I’m<br><span>Shivanthi.</span></h1>
  <p>I turn complex problems into clear, thoughtful experiences.</p>
</div>
<img class="sticker" src="assets/shivanthi-sticker.png" alt="">
</body>
</html>
